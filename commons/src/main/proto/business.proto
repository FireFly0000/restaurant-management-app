syntax = "proto3";

package com.restaurant.commons.core.rpc.business;
option java_multiple_files = true;
option java_package = "com.restaurant.commons.core.rpc.business";
option java_outer_classname = "BusinessRpc";

message UpdatedLocationManagerEvent {
  string location_id = 1;
  string new_manager_id = 2;
  optional string old_manager_id = 4;
  bool old_manager_has_other_locations = 5;
}

message UpdateFailedLocationManagerEvent{
  string location_id = 1;
  string new_manager_id = 2;
  optional string old_manager_id = 4;
}