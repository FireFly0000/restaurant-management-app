syntax = "proto3";

package com.restaurant.commons.core.rpc.storage;
option java_multiple_files = true;
option java_package="com.restaurant.commons.core.rpc.storage";
option java_outer_classname = "StorageRpc";

message CreateFileOnCloudRequest {
  string file_name = 1;
  string content_type = 2;
  bytes file_data = 3;
}

message CreateFileOnCloudResponse {
  string url = 1;
}

message FileCleanUpEvent {
  repeated string urls = 1;
}

message UploadLargeFileRequest {
  oneof data {
    FileMetadata medatadata = 1;
    bytes chunk_data = 2;
  }
}

message UploadFileRequest {
    FileMetadata medatadata = 1;
    bytes file_data = 2;
}

message UploadFileResponse{
  string cdn_url = 1;
}

message DeleteFileEvent{
  string object_name = 1;
  string bucket_name = 2;
}

message FileMetadata {
  string bucket_name = 1;
  string entity_id = 2;
  string file_category = 3;
  int64 content_length = 4;
  string file_name = 5;
  string file_type = 6;
}

service StorageService {
  rpc UploadStream(stream UploadLargeFileRequest) returns (UploadFileResponse);
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
}