syntax = "proto3";

package userService;
option java_multiple_files = true;
option java_package="com.restaurant.commons.core.rpc.user";
option java_outer_classname = "UserServiceRpc";

service UserService{
    //Existence checks
    rpc ExistsByPhoneNumber(ExistsByPhoneNumberRequest) returns (ExistsResponse);
    rpc ExistsByEmail(ExistsByEmailRequest) returns (ExistsResponse);
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
    rpc getUsersByIds(GetUsersByIdsRequest) returns (GetUsersByIdsResponse);

    // Lookup
    rpc FindByEmail(FindByEmailRequest) returns (FoundUserResponse);
    rpc FindById(FindByIdRequest) returns (FoundUserResponse);

    //updates
    rpc VerifyAccount(VerifyAccountRpcRequest) returns (VerifyAccountRpcResponse);
    rpc UpdatePassword(UpdatePasswordRpcRequest) returns (UpdatePasswordRpcResponse);
}

//Request messages
message ExistsByPhoneNumberRequest {
    string phone_number = 1;
}

message ExistsByEmailRequest {
    string email = 1;
}

message CreateUserRequest {
    string email = 1;
    string password = 2;
    string phone_number = 3;
    string first_name = 4;
    string last_name = 5;
    string avatar_url = 6;
}

message FindByEmailRequest {
    string email = 1;
}

message FindByIdRequest {
    string id = 1;
}

message VerifyAccountRpcRequest {
    string id = 1;
}

message UpdatePasswordRpcRequest {
    string id = 1;
    string password = 2;
}

//Response messages
message ExistsResponse {
    bool exists = 1;
}

message CreateUserResponse {
    string id = 1;
    string email = 2;
    string first_name = 3;
    string last_name = 4;
    string phone_number = 5;
    bool success = 6;
    string message = 7;
}

message GetUsersByIdsRequest {
    repeated string ids = 1;
}

message GetUsersByIdsResponse {
    repeated UserRpcResponse users = 1;
}

message UserRpcResponse {
    string id = 1;
    string user_type = 2;
    string email = 3;
    string birth_date = 4;
    string phone_number = 5;
    string first_name = 6;
    string last_name = 7;
    string avatar_url = 8;
}

message FoundUserResponse {
    string id = 1;
    string email = 2;
    string password = 3;
    string first_name = 4;
    string last_name = 5;
    string avatar_url = 6;
    string user_type = 7;
    bool is_active = 8;
    bool is_verified = 9;
    bool is_deleted = 10;
    bool found = 11;
    string phone_number = 12;
}

message VerifyAccountRpcResponse {
    string id = 1;
    string email = 2;
    string first_name = 3;
    string last_name = 4;
    string phone_number = 5;
    bool user_not_found = 6;
}

message UpdatePasswordRpcResponse {
    string id = 1;
    string email = 2;
    bool success = 3;
}