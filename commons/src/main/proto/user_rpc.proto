syntax = "proto3";

package userService;
option java_multiple_files = true;
option java_package="com.restaurant.commons.core.rpc.user";
option java_outer_classname = "UserServiceRpc";

service UserService{
    //Existence checks
    rpc existsByPhoneNumber(ExistsByPhoneNumberRequest) returns (ExistsResponse);
    rpc existsByEmail(ExistsByEmailRequest) returns (ExistsResponse);
    rpc createUser(CreateUserRequest) returns (CreateUserResponse);
}

//Request messages
message ExistsByPhoneNumberRequest {
    string phone_number = 1;
}

message ExistsByEmailRequest {
    string email = 1;
}

message CreateUserRequest {
    string email = 1;
    string password = 2;
    string phone_number = 3;
    string first_name = 4;
    string last_name = 5;
    string avatar_url = 6;
}

//Response messages
message ExistsResponse {
    bool exists = 1;
}

message CreateUserResponse {
    string id = 1;
    bool success = 2;
    string message = 3;
}

