server:
  port: ${GATEWAY_PORT:8081}
  netty:
    connection-timeout: 30s
  shutdown: graceful

spring:
  application:
    name: ${GATEWAY_APPLICATION_NAME:api-gateway}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            - name: CircuitBreaker
              args:
                name: defaultCircuitBreaker
                fallbackUri: forward:/fallback

          routes:
            # User Service Routes
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/follows/**, /api/v1/reviews/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30 # Requests per second
                    redis-rate-limiter.burstCapacity: 60 # Maximum number of requests in a burst
                    redis-rate-limiter.requestedToken: 1 # 1 token per request
                    key-resolver: "#{@defaultKeyResolver}"
#                - name: CircuitBreaker
#                  args:
#                    name: userServiceCircuitBreaker
#                    fallbackUri: forward:/fallback/user
                #- RewritePath=/api/v1/(?<segment>.*), /api/${segment}
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 3 # Retry 3 times
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET # Just retry with method GET
                    backoff:
                      firstBackoff: 50ms # First retry after 50 ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false

            # Auth Service Routes
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedToken: 1
                    key-resolver: "#{@defaultKeyResolver}"
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET, POST
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 3
                      basedOnPreviousValue: false

            # Business Service Routes
            - id: business-service
              uri: lb://business-service
              predicates:
                - Path=/api/v1/business/**, /api/v1/locations/**, /api/v1/location-settings/, /api/v1/business-roles/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedToken: 1
                    key-resolver: "#{@defaultKeyResolver}"
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms # First retry after 50 ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false

            # Menu Service Routes
            - id: menu-service
              uri: lb://menu-service
              predicates:
                - Path=/api/v1/categories/**, /api/v1/items/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedToken: 1
                    key-resolver: "#{@defaultKeyResolver}"
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms # First retry after 50 ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false

            # Order Service Routes
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedToken: 1
                    key-resolver: "#{@defaultKeyResolver}"
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms # First retry after 50 ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false

            # Promotion Service Routes
            - id: promotion-service
              uri: lb://promotion-service
              predicates:
                - Path=/api/v1/promotions/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedToken: 1
                    key-resolver: "#{@defaultKeyResolver}"
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms # First retry after 50 ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false

            # Revenue Service Routes
            - id: revenue-service
              uri: lb://revenue-service
              predicates:
                - Path=/api/v1/revenues/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedToken: 1
                    key-resolver: "#{@defaultKeyResolver}"
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms # First retry after 50 ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false

            # Notification Service Routes
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedToken: 1
                    key-resolver: "#{@defaultKeyResolver}"
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms # First retry after 50 ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false

            # Payment Service Routes
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 15
                    redis-rate-limiter.burstCapacity: 30
                    redis-rate-limiter.requestedToken: 1
                    key-resolver: "#{@defaultKeyResolver}"
                - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms # First retry after 50 ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false

#         Service Discovery
#          discovery:
#            locator:
#              enabled: true
#              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "${FRONTEND_URL:http://localhost:3000}"
                  - "http://localhost:8080"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

  # Redis configuration for rate limiting and caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 5s

# Dubbo Configuration for gRPC
dubbo:
  config-center:
    address: none

  application:
    name: ${GATEWAY_APPLICATION_NAME}
    qos-enable: false

  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    parameters:
      namespace: ${NACOS_NAMESPACE:dev}
    use-as-config-center: false
    use-as-metadata-center: false

  protocol:
    name: tri
    port: ${GATEWAY_DUBBO_PORT:20880}

  consumer:
    check: false
    timeout: 30000
    retries: 2
    loadbalance: roundrobin

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
    instances:
      userServiceCircuitBreaker:
        base-config: default
      authServiceCircuitBreaker:
        base-config: default
        failure-rate-threshold: 40

  timelimiter:
    configs:
      default:
        timeout-duration: 10s
        cancel-running-future: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      access: none
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.platform.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.apache.dubbo: INFO
    io.grpc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

app:
  api-gateway:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-expiration: ${JWT_ACCESS_EXPIRATION}  # 1 hour in milliseconds
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}  # 7 days in milliseconds
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
