server:
  port: ${GATEWAY_PORT:8081}
  netty:
    connection-timeout: 30s
  shutdown: graceful

spring:
  application:
    name: ${GATEWAY_APPLICATION_NAME:api-gateway}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      # Global CORS configuration
      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback

      # Route definitions for downstream services
      # Discovery client integration
      server:
        webflux:
          routes:
            # User Service Routes
                    - id: user-service
                      uri: lb://user-service
                      predicates:
                        - Path=/api/v1/users/**
                      filters:
                        - name: CircuitBreaker
                          args:
                            name: userServiceCircuitBreaker
                            fallbackUri: forward:/fallback/user
                        - RewritePath=/api/v1/users/(?<segment>.*), /api/users/${segment}
                        - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                        - name: Retry
                          args:
                            retries: 3
                            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                            methods: GET
                            backoff:
                              firstBackoff: 50ms
                              maxBackoff: 500ms
                              factor: 2
                              basedOnPreviousValue: false

                    # Auth Service Routes
                    - id: auth-service
                      uri: lb://auth-service
                      predicates:
                        - Path=/api/v1/auth/**
                      filters:
                        - name: CircuitBreaker
                          args:
                            name: authServiceCircuitBreaker
                            fallbackUri: forward:/fallback/auth
                        - RewritePath=/api/v1/auth/(?<segment>.*), /api/auth/${segment}
                        - AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}
                        - name: Retry
                          args:
                            retries: 2
                            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                            methods: GET, POST
                            backoff:
                              firstBackoff: 100ms
                              maxBackoff: 1000ms

                    # Public Auth Routes (no authentication required)
                    - id: auth-public
                      uri: lb://auth-service
                      predicates:
                        - Path=/api/v1/auth/login, /api/v1/auth/register, /api/v1/auth/refresh
                      filters:
                        - RewritePath=/api/v1/auth/(?<segment>.*), /api/auth/${segment}

                    # Health Check Routes
                    - id: user-service-health
                      uri: lb://user-service
                      predicates:
                        - Path=/health/user
                      filters:
                        - RewritePath=/health/user, /actuator/health

                    - id: auth-service-health
                      uri: lb://auth-service
                      predicates:
                        - Path=/health/auth
                      filters:
                        - RewritePath=/health/auth, /actuator/health
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                          allowed-origins:
                            - "${FRONTEND_URL:http://localhost:3000}"
                            - "http://localhost:8080"
                          allowed-methods:
                            - GET
                            - POST
                            - PUT
                            - DELETE
                            - PATCH
                            - OPTIONS
                          allowed-headers:
                            - "*"
                          allow-credentials: true
                          max-age: 3600

  # Redis configuration for rate limiting and caching
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 5s

# Dubbo Configuration for gRPC
dubbo:
  config-center:
    address: none

  application:
    name: ${GATEWAY_APPLICATION_NAME}
    qos-enable: false

  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    parameters:
      namespace: ${NACOS_NAMESPACE:dev}
    use-as-config-center: false
    use-as-metadata-center: false

  protocol:
    name: tri
    port:

  consumer:
    check: false
    timeout: 30000
    retries: 2
    loadbalance: roundrobin

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
    instances:
      userServiceCircuitBreaker:
        base-config: default
      authServiceCircuitBreaker:
        base-config: default
        failure-rate-threshold: 40

  timelimiter:
    configs:
      default:
        timeout-duration: 10s
        cancel-running-future: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}  # 1 hour in milliseconds
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}  # 7 days in milliseconds

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      access: none
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.platform.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.apache.dubbo: INFO
    io.grpc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"