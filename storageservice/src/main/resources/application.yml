# Logging Configuration
logging:
  level:
    root: INFO
    com.platform.authservice: DEBUG
    org.apache.dubbo: INFO
    org.springframework.kafka: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# Application-specific configuration
app:
  storage:
    kafka:
      retry:
        max-attempts: 3
        interval-ms: 2000
      consumer:
        concurency: 3
    # Cache settings
    cache:
      ttl-seconds: 3600
      prefix: "storage:"
    # Outbox settings
    outbox:
      core-pool-size: 5
      max-pool-size: 20
      queue-capacity: 100
      thread-name-prefix: "StorageOutboxWorker-"
      batch-size: 50
      max_retries: 3

    cloudflare:
      r2:
        account-id: ${CLOUDFLARE_R2_ACCOUNT_ID}
        access-key: ${CLOUDFLARE_R2_ACCESS_KEY}
        secret-key: ${CLOUDFLARE_R2_SECRET_KEY}
        url: ${CLOUDFLARE_R2_URL}
        public-bucket: ${CLOUDFLARE_R2_PUBLIC_BUCKET}
        private-bucket: ${CLOUDFLARE_R2_PRIVATE_BUCKET}
        object-public-url: ${CLOUDFLARE_R2_OBJECT_PUBLIC_URL}

