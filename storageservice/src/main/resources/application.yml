server:
  port: ${STORAGE_PORT:8088}
  shutdown: graceful

spring:
  application:
    name: ${STORAGE_APPLICATION_NAME:storage-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:dev}

  # Redis Configuration (for token storage and caching)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 10s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3s

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
      acks: all
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_HOST:http://localhost}:${SCHEMA_REGISTRY_PORT:8081}
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retry.backoff.ms: 1000
        delivery.timeout.ms: 120000
        request.timeout.ms: 10000
        linger.ms: 5
        batch.size: 16384
        buffer.memory: 33554432
        compression.type: snappy

    consumer:
      group-id: storage-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
      enable-auto-commit: false
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_HOST:http://localhost}:${SCHEMA_REGISTRY_PORT:8081}
        derive.type: true
        max.poll.records: 100
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000

    listener:
      ack-mode: manual
      concurrency: 3
      type: batch

    admin:
      auto-create: true
      properties:
        cleanup.policy: delete
        retention.ms: 604800000

# Dubbo Configuration for gRPC
dubbo:
  config-center:
    address: none

  application:
    name: ${STORAGE_APPLICATION_NAME:storage-service}
    qos-enable: false

  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    parameters:
      namespace: ${NACOS_NAMESPACE:dev}
    use-as-config-center: false
    use-as-metadata-center: false

  protocol:
    name: tri
    port: ${STORAGE_DUBBO_PORT:20882}

  consumer:
    check: false
    timeout: 30000
    retries: 2
    loadbalance: roundrobin


