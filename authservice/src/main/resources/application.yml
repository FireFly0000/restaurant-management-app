server:
  port: ${AUTH_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: ${AUTH_APPLICATION_NAME:auth-service}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:dev}

  datasource:
    url: jdbc:postgresql://${PG_DB_HOST:localhost}:${PG_DB_PORT:5432}/${PG_DB_NAME:restaurant_db}
    username: ${PG_DB_USERNAME:res_admin}
    password: ${PG_DB_PASSWORD:Abc@1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AuthServiceHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
    open-in-view: false

  # Redis Configuration (for token storage and caching)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 10s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3s

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retry.backoff.ms: 1000
        delivery.timeout.ms: 120000
        linger.ms: 5
        batch.size: 16384
        buffer.memory: 33554432
        compression.type: snappy

    consumer:
      group-id: auth-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.restaurant.*
        max.poll.records: 100
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000

    listener:
      ack-mode: manual
      concurrency: 3
      type: batch

    admin:
      auto-create: true
      properties:
        cleanup.policy: delete
        retention.ms: 604800000

# Dubbo Configuration for gRPC
dubbo:
  config-center:
    address: none

  application:
    name: ${AUTH_APPLICATION_NAME:auth-service}
    qos-enable: false

  registry:
    address: nacos://${NACOS_HOST:localhost}:${NACOS_PORT:8848}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    parameters:
      namespace: ${NACOS_NAMESPACE:dev}
    use-as-config-center: false
    use-as-metadata-center: false

  protocol:
    name: tri
    port: ${AUTH_DUBBO_PORT:20881}

  consumer:
    check: false
    timeout: 30000
    retries: 2
    loadbalance: roundrobin

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}  # 1 hour in milliseconds
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}  # 7 days in milliseconds

# Kafka Topic Names
kafka:
  topics:
    auth-login: auth.login
    auth-logout: auth.logout
    auth-register: auth.register
    auth-password-reset: auth.password.reset
    auth-token-refresh: auth.token.refresh
    auth-events: auth.events
    # Listen to user events
    user-created: user.created
    user-deleted: user.deleted

